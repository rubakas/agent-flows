<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-flows</title>
    <style>
      :root {
        --bg: #eceef1;
        --panel: #f8f9fb;
        --sunk: #e2e6ea;
        --line: #ccd2d9;
        --ink: #161a20;
        --ink-2: #414954;
        --muted: #6d7783;
        --accent: #2d6a92;
        --accent-bg: #d9e6ef;
        --ok: #2a7a3b;
        --err: #b52d2d;
        --ui: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        --mono: ui-monospace, "Cascadia Code", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101318;
          --panel: #171c23;
          --sunk: #0c0f13;
          --line: #2a323c;
          --ink: #e6e9ec;
          --ink-2: #bcc3cb;
          --muted: #838d99;
          --accent: #6aa9d6;
          --accent-bg: #17303f;
          --ok: #4db86a;
          --err: #e05555;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--ui);
        font-size: 14px;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 16px;
        font-weight: 600;
      }
      header .spacer {
        flex: 1;
      }
      .btn {
        font: inherit;
        font-size: 13px;
        padding: 5px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        line-height: 1.4;
      }
      .btn:hover {
        background: var(--sunk);
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .btn.primary:hover {
        opacity: 0.88;
      }
      .btn.danger {
        color: var(--err);
        border-color: var(--err);
      }
      .btn.danger:hover {
        background: color-mix(in srgb, var(--err) 10%, transparent);
      }
      main {
        padding: 20px;
        max-width: 1000px;
      }
      .section {
        margin-bottom: 28px;
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .section-header h2 {
        font-size: 14px;
        font-weight: 600;
      }
      .tier-badge {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 10px;
        background: var(--sunk);
        color: var(--muted);
        font-weight: 500;
      }
      .tier-project {
        background: var(--accent-bg);
        color: var(--accent);
      }
      .tier-template {
        background: color-mix(in srgb, #9a7318 12%, transparent);
        color: #9a7318;
      }
      .tier-bundled {
        background: color-mix(in srgb, var(--muted) 12%, transparent);
        color: var(--muted);
      }
      @media (prefers-color-scheme: dark) {
        .tier-project {
          color: var(--accent);
        }
        .tier-template {
          color: #d9a441;
        }
        .tier-bundled {
          color: var(--muted);
        }
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        padding: 4px 10px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: color-mix(in srgb, var(--accent) 5%, transparent);
      }
      .pipeline-id {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 500;
      }
      .pipeline-desc {
        color: var(--ink-2);
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .empty {
        color: var(--muted);
        font-style: italic;
        padding: 12px 10px;
      }
      .error-box {
        background: color-mix(in srgb, var(--err) 8%, transparent);
        color: var(--err);
        border: 1px solid var(--err);
        border-radius: 6px;
        padding: 10px 14px;
        margin: 8px 0;
        font-size: 13px;
      }
      .success-box {
        background: color-mix(in srgb, var(--ok) 8%, transparent);
        color: var(--ok);
        border: 1px solid var(--ok);
        border-radius: 6px;
        padding: 10px 14px;
        margin: 8px 0;
        font-size: 13px;
      }
      /* Detail panel */
      #detail-panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 480px;
        max-width: 100vw;
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.12);
        overflow-y: auto;
        display: none;
        z-index: 100;
      }
      #detail-panel.open {
        display: block;
      }
      #detail-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--panel);
      }
      #detail-header h3 {
        font-size: 15px;
        flex: 1;
        font-family: var(--mono);
      }
      #detail-body {
        padding: 16px;
      }
      .step-row {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        margin-bottom: 6px;
      }
      .step-kind {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--sunk);
        color: var(--muted);
        margin-right: 6px;
      }
      .step-id {
        font-family: var(--mono);
        font-size: 13px;
      }
      /* Dialog */
      #dialog-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 200;
        align-items: center;
        justify-content: center;
      }
      #dialog-backdrop.open {
        display: flex;
      }
      #dialog {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
        width: 420px;
        max-width: 96vw;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }
      #dialog h3 {
        font-size: 15px;
        margin-bottom: 14px;
      }
      #dialog label {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
        color: var(--ink-2);
      }
      #dialog select,
      #dialog input[type="text"] {
        width: 100%;
        font: inherit;
        font-size: 13px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--sunk);
        color: var(--ink);
        margin-bottom: 12px;
      }
      #dialog .dialog-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 4px;
      }
      #flash {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 8px 18px;
        border-radius: 6px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        z-index: 999;
      }
      #flash.show {
        opacity: 1;
      }
      /* Run observability */
      .run-status {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 10px;
        background: var(--sunk);
        color: var(--muted);
      }
      .run-status.running {
        background: color-mix(in srgb, var(--accent) 15%, transparent);
        color: var(--accent);
      }
      .run-status.suspended {
        background: color-mix(in srgb, #9a7318 15%, transparent);
        color: #9a7318;
      }
      @media (prefers-color-scheme: dark) {
        .run-status.suspended {
          color: #d9a441;
        }
      }
      .run-status.success {
        background: color-mix(in srgb, var(--ok) 15%, transparent);
        color: var(--ok);
      }
      .run-status.failed {
        background: color-mix(in srgb, var(--err) 15%, transparent);
        color: var(--err);
      }
      .step-output {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .gate-box {
        background: color-mix(in srgb, #9a7318 8%, transparent);
        border: 1px solid #9a7318;
        border-radius: 6px;
        padding: 10px 14px;
        margin: 10px 0;
        font-size: 13px;
      }
      .gate-box p {
        margin-bottom: 8px;
        color: var(--ink);
      }
      .gate-actions {
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>agent-flows</h1>
      <span class="spacer"></span>
      <span id="n8n-status-badge" style="font-size: 12px; color: var(--muted)">n8n: checking…</span>
      <button class="btn" id="btn-new-in-n8n" style="display: none">New in n8n</button>
      <button class="btn primary" id="btn-save-from-n8n" style="display: none">
        Save from n8n…
      </button>
    </header>

    <main>
      <div id="flash-area"></div>

      <!-- Active Runs -->
      <div class="section">
        <div class="section-header">
          <h2>Active Runs</h2>
          <button class="btn" id="btn-refresh-runs" style="margin-left: auto">Refresh</button>
        </div>
        <div id="runs-table-wrap">Loading…</div>
      </div>

      <!-- Project tier -->
      <div class="section">
        <div class="section-header">
          <h2>Project workflows</h2>
          <span class="tier-badge tier-project">project</span>
        </div>
        <div id="project-table-wrap">Loading…</div>
      </div>

      <!-- Template tier -->
      <div class="section">
        <div class="section-header">
          <h2>Templates</h2>
          <span class="tier-badge tier-template">template</span>
          <span style="font-size: 12px; color: var(--muted)">global ~/.agent-flows/templates/</span>
        </div>
        <div id="template-table-wrap">Loading…</div>
      </div>

      <!-- Bundled tier -->
      <div class="section">
        <div class="section-header">
          <h2>Bundled workflows</h2>
          <span class="tier-badge tier-bundled">bundled</span>
        </div>
        <div id="bundled-table-wrap">Loading…</div>
      </div>
    </main>

    <!-- Read-only detail panel -->
    <div id="detail-panel">
      <div id="detail-header">
        <h3 id="detail-title">—</h3>
        <button class="btn" id="btn-close-detail">✕</button>
      </div>
      <div id="detail-body"></div>
    </div>

    <!-- Save-from-n8n dialog -->
    <div id="dialog-backdrop">
      <div id="dialog">
        <h3>Save workflow from n8n as template</h3>
        <label for="dlg-wf-select">n8n workflow</label>
        <select id="dlg-wf-select">
          <option value="">Loading…</option>
        </select>
        <label for="dlg-template-id">Template id (optional)</label>
        <input type="text" id="dlg-template-id" placeholder="auto (slugified workflow name)" />
        <div class="dialog-actions">
          <button class="btn" id="btn-dlg-cancel">Cancel</button>
          <button class="btn primary" id="btn-dlg-save">Save</button>
        </div>
        <div id="dlg-error" class="error-box" style="display: none; margin-top: 10px"></div>
      </div>
    </div>

    <div id="flash"></div>

    <script>
      // ── DOM helpers ────────────────────────────────────────────────────────

      /** Escape HTML entities. All untrusted data reaching the DOM goes through this. */
      function escH(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function flash(msg, isErr) {
        const el = document.getElementById("flash");
        el.textContent = msg;
        el.style.background = isErr ? "var(--err)" : "var(--ink)";
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 3000);
      }

      async function api(method, path, body) {
        const opts = { method, headers: { "content-type": "application/json" } };
        if (body !== undefined) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        const json = await res.json().catch(() => ({}));
        if (!res.ok)
          throw Object.assign(new Error(json.error || "Request failed"), { status: res.status });
        return json;
      }

      // ── Detail panel ───────────────────────────────────────────────────────

      const detailPanel = document.getElementById("detail-panel");
      document.getElementById("btn-close-detail").onclick = () => {
        if (activeRunEs) {
          activeRunEs.close();
          activeRunEs = null;
        }
        detailPanel.classList.remove("open");
      };

      function showDetail(title, steps, inputs, description) {
        document.getElementById("detail-title").textContent = title;
        const body = document.getElementById("detail-body");
        let html = "";
        if (description)
          html += `<p style="margin-bottom:10px;color:var(--ink-2);font-size:13px">${escH(description)}</p>`;
        if (inputs && inputs.length) {
          html += `<div style="margin-bottom:12px"><strong style="font-size:12px;color:var(--muted)">INPUTS</strong> `;
          html += inputs
            .map(
              (i) =>
                `<code style="font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:3px">${escH(i)}</code>`
            )
            .join(" ");
          html += "</div>";
        }
        if (steps && steps.length) {
          html += `<div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px">STEPS</div>`;
          for (const s of steps) {
            const deps =
              s.dependsOn && s.dependsOn.length ? ` ← ${escH(s.dependsOn.join(", "))}` : "";
            html += `<div class="step-row">
              <span class="step-kind">${escH(s.kind)}</span>
              <span class="step-id">${escH(s.id)}</span>
              <span style="color:var(--muted);font-size:12px">${deps}</span>
            </div>`;
          }
        }
        body.innerHTML = html;
        detailPanel.classList.add("open");
      }

      // ── n8n state ──────────────────────────────────────────────────────────

      let n8nBaseUrl = null;

      async function loadN8nStatus() {
        try {
          const s = await api("GET", "/api/n8n/status");
          if (s.configured) {
            n8nBaseUrl = s.baseUrl;
            document.getElementById("n8n-status-badge").textContent = "n8n: connected";
            document.getElementById("n8n-status-badge").style.color = "var(--ok)";
            document.getElementById("btn-new-in-n8n").style.display = "";
            document.getElementById("btn-save-from-n8n").style.display = "";
          } else {
            document.getElementById("n8n-status-badge").textContent = "n8n: not configured";
          }
        } catch {
          document.getElementById("n8n-status-badge").textContent = "n8n: error";
        }
      }

      document.getElementById("btn-new-in-n8n").onclick = () => {
        if (n8nBaseUrl) window.open(`${n8nBaseUrl}/workflow/new`, "_blank");
      };

      // ── Project tier ───────────────────────────────────────────────────────

      async function loadProjectTier() {
        const wrap = document.getElementById("project-table-wrap");
        try {
          const env = await api("GET", "/api/environment");
          const installed = env.installed || [];
          if (!installed.length) {
            wrap.innerHTML = `<p class="empty">No workflows installed in this project.</p>`;
            return;
          }
          let html = `<table><thead><tr>
            <th>ID</th><th>Tier</th><th>Actions</th>
          </tr></thead><tbody>`;
          for (const id of installed) {
            html += `<tr>
              <td class="pipeline-id">${escH(id)}</td>
              <td><span class="tier-badge tier-project">project</span></td>
              <td class="actions">
                <button class="btn" data-view-project="${escH(id)}">View</button>
                <button class="btn" data-edit-n8n="${escH(id)}" ${n8nBaseUrl ? "" : 'disabled title="n8n not configured"'}>Edit in n8n</button>
                <button class="btn danger" data-del-project="${escH(id)}">Delete</button>
              </td>
            </tr>`;
          }
          html += "</tbody></table>";
          wrap.innerHTML = html;

          // Wire view buttons
          wrap.querySelectorAll("[data-view-project]").forEach((btn) => {
            btn.onclick = async () => {
              try {
                const d = await api(
                  "GET",
                  `/api/pipelines/${encodeURIComponent(btn.dataset.viewProject)}`
                );
                showDetail(btn.dataset.viewProject, d.def.steps, d.def.inputs, d.def.description);
              } catch (e) {
                flash(e.message, true);
              }
            };
          });

          // Wire edit-in-n8n buttons
          wrap.querySelectorAll("[data-edit-n8n]").forEach((btn) => {
            btn.onclick = async () => {
              try {
                const r = await api(
                  "POST",
                  `/api/pipelines/${encodeURIComponent(btn.dataset.editN8n)}/n8n`,
                  {}
                );
                window.open(r.url, "_blank");
              } catch (e) {
                flash(e.message, true);
              }
            };
          });

          // Wire delete buttons
          wrap.querySelectorAll("[data-del-project]").forEach((btn) => {
            btn.onclick = async () => {
              const id = btn.dataset.delProject;
              if (!confirm(`Delete pipeline "${id}"?`)) return;
              try {
                await api("DELETE", `/api/pipelines/${encodeURIComponent(id)}`, {});
                flash(`Deleted "${id}"`);
                loadProjectTier();
              } catch (e) {
                flash(e.message, true);
              }
            };
          });
        } catch (e) {
          wrap.innerHTML = `<div class="error-box">${escH(e.message)}</div>`;
        }
      }

      // ── Template tier ──────────────────────────────────────────────────────

      async function loadTemplateTier() {
        const wrap = document.getElementById("template-table-wrap");
        try {
          const data = await api("GET", "/api/templates");
          const templates = data.templates || [];
          if (!templates.length) {
            wrap.innerHTML = `<p class="empty">No templates saved yet. Use "Save from n8n…" to add one.</p>`;
            return;
          }
          let html = `<table><thead><tr>
            <th>ID</th><th>Tier</th><th>Source pipeline</th><th>Actions</th>
          </tr></thead><tbody>`;
          for (const t of templates) {
            html += `<tr>
              <td class="pipeline-id">${escH(t.templateId)}</td>
              <td><span class="tier-badge tier-template">template</span></td>
              <td class="pipeline-desc">${escH(t.sourcePipeline)}</td>
              <td class="actions">
                <button class="btn" data-install-tmpl="${escH(t.templateId)}">Install</button>
                <button class="btn danger" data-del-tmpl="${escH(t.templateId)}">Delete</button>
              </td>
            </tr>`;
          }
          html += "</tbody></table>";
          wrap.innerHTML = html;

          wrap.querySelectorAll("[data-install-tmpl]").forEach((btn) => {
            btn.onclick = async () => {
              try {
                const r = await api(
                  "POST",
                  `/api/templates/${encodeURIComponent(btn.dataset.installTmpl)}/install`,
                  {}
                );
                flash(`Installed: ${r.written.join(", ") || "(already up to date)"}`);
                loadProjectTier();
              } catch (e) {
                flash(e.message, true);
              }
            };
          });

          wrap.querySelectorAll("[data-del-tmpl]").forEach((btn) => {
            btn.onclick = async () => {
              const id = btn.dataset.delTmpl;
              if (!confirm(`Delete template "${id}"?`)) return;
              try {
                await api("DELETE", `/api/templates/${encodeURIComponent(id)}`, {});
                flash(`Deleted template "${id}"`);
                loadTemplateTier();
              } catch (e) {
                flash(e.message, true);
              }
            };
          });
        } catch (e) {
          wrap.innerHTML = `<div class="error-box">${escH(e.message)}</div>`;
        }
      }

      // ── Bundled tier ───────────────────────────────────────────────────────

      async function loadBundledTier() {
        const wrap = document.getElementById("bundled-table-wrap");
        try {
          const env = await api("GET", "/api/environment");
          const available = env.available || [];
          if (!available.length) {
            wrap.innerHTML = `<p class="empty">No bundled workflows found.</p>`;
            return;
          }
          let html = `<table><thead><tr>
            <th>ID</th><th>Tier</th><th>Actions</th>
          </tr></thead><tbody>`;
          for (const id of available) {
            html += `<tr>
              <td class="pipeline-id">${escH(id)}</td>
              <td><span class="tier-badge tier-bundled">bundled</span></td>
              <td class="actions">
                <button class="btn" data-install-bundled="${escH(id)}">Install</button>
              </td>
            </tr>`;
          }
          html += "</tbody></table>";
          wrap.innerHTML = html;

          wrap.querySelectorAll("[data-install-bundled]").forEach((btn) => {
            btn.onclick = async () => {
              try {
                const r = await api("POST", "/api/install", {
                  ids: [btn.dataset.installBundled],
                  overwrite: false,
                });
                flash(`Installed: ${r.written.join(", ") || "(already up to date)"}`);
                loadProjectTier();
              } catch (e) {
                flash(e.message, true);
              }
            };
          });
        } catch (e) {
          wrap.innerHTML = `<div class="error-box">${escH(e.message)}</div>`;
        }
      }

      // ── Save-from-n8n dialog ────────────────────────────────────────────────

      const dialogBackdrop = document.getElementById("dialog-backdrop");
      document.getElementById("btn-dlg-cancel").onclick = () =>
        dialogBackdrop.classList.remove("open");
      dialogBackdrop.onclick = (e) => {
        if (e.target === dialogBackdrop) dialogBackdrop.classList.remove("open");
      };

      document.getElementById("btn-save-from-n8n").onclick = async () => {
        const select = document.getElementById("dlg-wf-select");
        const dlgError = document.getElementById("dlg-error");
        dlgError.style.display = "none";
        select.innerHTML = `<option value="">Loading workflows…</option>`;
        dialogBackdrop.classList.add("open");
        try {
          const data = await api("GET", "/api/n8n/workflows");
          const wfs = data.workflows || [];
          if (!wfs.length) {
            select.innerHTML = `<option value="">No workflows found in n8n</option>`;
          } else {
            // escH on workflow names — they are untrusted input (FR-013)
            select.innerHTML = wfs
              .map((w) => `<option value="${escH(w.id)}">${escH(w.name)}</option>`)
              .join("");
          }
        } catch (e) {
          select.innerHTML = `<option value="">Error loading workflows</option>`;
          dlgError.textContent = escH(e.message);
          dlgError.style.display = "";
        }
      };

      document.getElementById("btn-dlg-save").onclick = async () => {
        const select = document.getElementById("dlg-wf-select");
        const templateIdInput = document.getElementById("dlg-template-id");
        const dlgError = document.getElementById("dlg-error");
        dlgError.style.display = "none";

        const workflowId = select.value;
        if (!workflowId) {
          flash("Select a workflow first", true);
          return;
        }
        const templateId = templateIdInput.value.trim() || undefined;

        try {
          const r = await api("POST", "/api/templates/from-n8n", { workflowId, templateId });
          flash(`Saved as template "${escH(r.templateId)}"`);
          dialogBackdrop.classList.remove("open");
          templateIdInput.value = "";
          loadTemplateTier();
        } catch (e) {
          dlgError.textContent = escH(e.message);
          dlgError.style.display = "";
        }
      };

      // ── Run observability ──────────────────────────────────────────────────

      /** Active SSE connection for the currently-watched run, if any. */
      let activeRunEs = null;

      /** Format a UTC ISO string as a short local time string. */
      function fmtTime(iso) {
        try {
          return new Date(iso).toLocaleString();
        } catch {
          return iso;
        }
      }

      /** Return a CSS class name for a run/step status string. */
      function statusClass(s) {
        if (s === "running" || s === "started") return "running";
        if (s === "suspended") return "suspended";
        if (s === "success" || s === "completed") return "success";
        if (s === "failed" || s === "cancelled" || s === "terminated") return "failed";
        return "";
      }

      async function loadRuns() {
        const wrap = document.getElementById("runs-table-wrap");
        try {
          const data = await api("GET", "/api/runs");
          const runs = data.runs || [];
          if (!runs.length) {
            wrap.innerHTML = `<p class="empty">No active runs.</p>`;
            return;
          }
          const suspended = runs.filter((r) => r.status === "suspended");
          let html = "";
          if (suspended.length) {
            const noun = suspended.length === 1 ? "run" : "runs";
            html += `<div class="gate-box" style="margin-bottom:10px">
              <p><strong>${escH(String(suspended.length))} suspended ${noun} — waiting for your approval.</strong></p>
            </div>`;
          }
          const activeCount = runs.filter(
            (r) => r.status === "running" || r.status === "started" || r.status === "suspended"
          ).length;
          if (activeCount > 0) {
            html += `<p style="font-size:12px;color:var(--muted);margin-bottom:6px">${escH(String(activeCount))} active, ${escH(String(runs.length))} total</p>`;
          }
          html += `<table><thead><tr>
            <th>Run ID</th><th>Pipeline</th><th>Status</th><th>Started</th><th>Actions</th>
          </tr></thead><tbody>`;
          for (const r of runs) {
            const sc = statusClass(r.status);
            html += `<tr>
              <td class="pipeline-id">${escH(r.runId)}</td>
              <td class="pipeline-desc">${escH(r.pipelineId)}</td>
              <td><span class="run-status ${escH(sc)}">${escH(r.status)}</span></td>
              <td style="font-size:12px;color:var(--muted)">${escH(fmtTime(r.createdAt))}</td>
              <td class="actions">
                <button class="btn" data-attach-run="${escH(r.runId)}">Attach</button>
              </td>
            </tr>`;
          }
          html += "</tbody></table>";
          wrap.innerHTML = html;

          wrap.querySelectorAll("[data-attach-run]").forEach((btn) => {
            btn.onclick = () => attachToRun(btn.dataset.attachRun);
          });
        } catch (e) {
          wrap.innerHTML = `<div class="error-box">${escH(e.message)}</div>`;
        }
      }

      document.getElementById("btn-refresh-runs").onclick = () => loadRuns();

      // ── Runs auto-refresh ──────────────────────────────────────────────────

      let _runsPoller = null;

      function startRunsPoller() {
        if (_runsPoller !== null) return;
        _runsPoller = setInterval(() => {
          // Skip when tab is hidden or an SSE stream is delivering live updates.
          if (document.hidden || activeRunEs !== null) return;
          loadRuns();
        }, 4000);
      }

      // Refresh immediately when the tab becomes visible again.
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && activeRunEs === null) loadRuns();
      });

      /**
       * Open the detail panel for a run and follow it live via SSE.
       * Closes any previously-open SSE connection first.
       */
      async function attachToRun(runId) {
        // Close any existing SSE connection for a previously watched run.
        if (activeRunEs) {
          activeRunEs.close();
          activeRunEs = null;
        }

        const panel = document.getElementById("detail-panel");
        const titleEl = document.getElementById("detail-title");
        const body = document.getElementById("detail-body");

        // Show the panel with a loading state.
        titleEl.textContent = runId; // plain text assignment — safe
        body.innerHTML = `<p style="color:var(--muted);font-size:13px">Connecting…</p>`;
        panel.classList.add("open");

        // Fetch the current snapshot synchronously so we have a starting state.
        let snapshot;
        try {
          snapshot = await api("GET", `/api/runs/${encodeURIComponent(runId)}`);
        } catch (e) {
          body.innerHTML = `<div class="error-box">${escH(e.message)}</div>`;
          return;
        }

        // Render the snapshot and wire the gate actions if suspended.
        renderRunDetail(runId, snapshot, body);

        // Subscribe to live SSE events for subsequent updates.
        const es = new EventSource(`/api/runs/${encodeURIComponent(runId)}/events`);
        activeRunEs = es;

        es.addEventListener("snapshot", (ev) => {
          let data;
          try {
            data = JSON.parse(ev.data);
          } catch {
            return;
          }
          renderRunDetail(runId, data, body);
        });

        es.addEventListener("step", (ev) => {
          let data;
          try {
            data = JSON.parse(ev.data);
          } catch {
            return;
          }
          updateStepRow(data);
        });

        es.onerror = () => {
          // Silently stop — the panel still shows last-known state.
          es.close();
          if (activeRunEs === es) activeRunEs = null;
        };
      }

      /**
       * Render (or re-render) the run detail panel body from a snapshot object.
       * All server data is escaped or written via textContent.
       */
      function renderRunDetail(runId, snapshot, body) {
        const status = snapshot.status || "unknown";
        const sc = statusClass(status);
        let html = `<div style="margin-bottom:10px">
          <span class="run-status ${escH(sc)}">${escH(status)}</span>
        </div>`;

        // Gate controls — shown only when the run is suspended.
        if (status === "suspended" && snapshot.gateMessage) {
          html += `<div class="gate-box">
            <p>${escH(snapshot.gateMessage)}</p>
            <div class="gate-actions">
              <button class="btn primary" id="btn-approve-run">Approve</button>
              <button class="btn danger" id="btn-reject-run">Reject (terminates run)</button>
            </div>
          </div>`;
        }

        // Steps table.
        const steps = snapshot.steps || {};
        const stepIds = Object.keys(steps);
        if (stepIds.length) {
          html += `<div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px">STEPS</div>`;
          for (const sid of stepIds) {
            const st = steps[sid];
            const stClass = statusClass(st.status || "");
            html += `<div class="step-row" data-step-id="${escH(sid)}">
              <span class="step-id">${escH(sid)}</span>
              <span class="run-status ${escH(stClass)}" style="margin-left:6px">${escH(st.status || "pending")}</span>`;
            if (st.outputExcerpt) {
              // step output is untrusted model-produced text — use escH
              html += `<div class="step-output">${escH(st.outputExcerpt)}</div>`;
            }
            html += `</div>`;
          }
        } else {
          html += `<p style="color:var(--muted);font-size:13px;margin-top:8px">No steps recorded yet.</p>`;
        }

        body.innerHTML = html;

        // Wire approve/reject after setting innerHTML.
        const approveBtn = body.querySelector("#btn-approve-run");
        const rejectBtn = body.querySelector("#btn-reject-run");
        if (approveBtn) {
          approveBtn.onclick = async () => {
            try {
              await api("POST", `/api/runs/${encodeURIComponent(runId)}/approve`, {
                approved: true,
              });
              flash("Run approved");
              loadRuns();
            } catch (e) {
              flash(e.message, true);
            }
          };
        }
        if (rejectBtn) {
          rejectBtn.onclick = async () => {
            if (!confirm("Reject this run? The run will be terminated.")) return;
            try {
              await api("POST", `/api/runs/${encodeURIComponent(runId)}/approve`, {
                approved: false,
              });
              flash("Run rejected — run terminated");
              loadRuns();
            } catch (e) {
              flash(e.message, true);
            }
          };
        }
      }

      /**
       * Update a single step row in-place when a live SSE step event arrives.
       * Falls back to a full re-render if the step is new (not yet in the DOM).
       */
      function updateStepRow(data) {
        const { stepId, status, outputExcerpt } = data;
        if (!stepId) return;

        const row = document.querySelector(`[data-step-id="${CSS.escape(stepId)}"]`);
        if (!row) {
          // Step not yet in panel — trigger a full re-fetch to pick it up.
          return;
        }

        // Update status badge.
        const badge = row.querySelector(".run-status");
        if (badge) {
          const sc = statusClass(status || "");
          badge.className = `run-status ${sc}`;
          badge.textContent = status || ""; // .textContent — safe
        }

        // Update or add output excerpt.
        if (outputExcerpt !== undefined) {
          let outEl = row.querySelector(".step-output");
          if (!outEl) {
            outEl = document.createElement("div");
            outEl.className = "step-output";
            row.appendChild(outEl);
          }
          outEl.textContent = outputExcerpt; // .textContent — safe, untrusted model output
        }
      }

      // ── Boot ───────────────────────────────────────────────────────────────

      (async () => {
        await loadN8nStatus();
        await Promise.all([loadProjectTier(), loadTemplateTier(), loadBundledTier(), loadRuns()]);
        startRunsPoller();
      })();
    </script>
  </body>
</html>
