version: "3.9"

# ─── agent-flows node stack (ADR-0007) ──────────────────────────────────────────────
# Start with: docker compose up -d
# Secure remote access via Tailscale or SSH (ADR-0007).

services:
  # ── LiteLLM proxy — Layer-0 key isolation (ADR-0004) ──────────────────────
  # Real provider keys live here only. agent-flows sees only LITELLM_VIRTUAL_KEY.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:litellm@postgres:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: --config /app/config.yaml
    depends_on:
      - postgres
    restart: unless-stopped

  # ── Postgres — LiteLLM virtual-key store ──────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  # agent_flows_data:
