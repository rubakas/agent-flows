id: investigate
version: 1
description: Read the real repo and surface what matters before any code is written
# stage-handoff (spec 029 FR-011): outputs findings in result. result is the run's
# accumulated context keyed by step id; the "findings" step output is at result.findings.
# A downstream stage (e.g. spec-creation) reads artifact.result.findings → inputs.findings.
inputs:
  - request
steps:
  - id: survey
    kind: llm
    role: scout
    permissions:
      contents: read
    prompt: prompts/investigate-survey.md
  - id: findings
    kind: llm
    role: scout # condenses an existing survey into a brief; analyst-class step analogous to tech-writer
    dependsOn: [survey]
    prompt: prompts/investigate-findings.md
