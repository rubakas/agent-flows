id: develop
version: 1
description: Execute an approved implementation plan by writing code and tests
inputs:
  - plan
steps:
  - id: implement
    kind: llm
    role: worker
    # No hard deadline: the progress watchdog (spec-024) supervises liveness via the
    # event stream. A full spec implementation may legitimately take hours on a local model.
    permissions:
      contents: write
    prompt: prompts/develop-implement.md
