id: audit
version: 1
description: Adversarial read-only review of a plan; fans out to correctness and security then converges
# stage-handoff (spec 029 FR-011): inputs.plan ← artifact.spec from spec-creation or
# correct-plan. artifact.spec may be a HardenedSpec object (spec-creation) or a plain
# string (correct-plan); a HardenedSpec is rendered with renderSpecKitSpec so plan
# arrives as the same markdown the operator read at the gate. The synthesis step outputs
# its verdict in result (accumulated context); a caller that wants findings reads
# artifact.result.findings.
inputs:
  - plan
steps:
  - id: correctness
    kind: llm
    role: worker # adversarial review of one dimension; reviewer-class agents run on sonnet
    permissions:
      contents: read
    prompt: prompts/audit-correctness.md
  - id: security
    kind: llm
    role: worker # same reasoning as correctness — single-dimension adversarial review
    permissions:
      contents: read
    prompt: prompts/audit-security.md
  - id: synthesis
    kind: llm
    role: reasoner # reconciles two opposing reviews into a verdict; judgment across both reports
    dependsOn: [correctness, security]
    prompt: prompts/audit-synthesis.md
