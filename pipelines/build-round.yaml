id: build-round
version: 1
description: Single test-and-fix iteration; composed into build.yaml as a bounded loop
inputs: []
steps:
  - id: test
    kind: check
    # Command is resolved from .agent-flows/config.json (checkCommand key) or
    # defaults to: pnpm lint && pnpm typecheck && pnpm format:check && pnpm test
    # format:check is part of the gate: a gate weaker than the project's own check
    # script converges on code the project rejects — a live self-run did exactly
    # that on unformatted files when the default omitted it (spec 023 FR-003).
    command: "{{checkCommand}}"
  # fix also runs on the loop's final passing iteration: the canon has no
  # conditionals, so a step cannot be skipped on the strength of a sibling's
  # result. Its edits are therefore unchecked here, which is why build.yaml runs
  # a required verification check after the loop.
  - id: fix
    kind: llm
    role: worker
    # No hard deadline: the progress watchdog (spec-024) supervises liveness via
    # the event stream. Scope-bounded repair may still need hours on a local model.
    permissions:
      contents: write
    dependsOn: [test]
    prompt: prompts/build-fix.md
