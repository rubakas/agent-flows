id: cycle-dev
version: 1
description: Full development lifecycle — investigate, plan, and build (stops before ship; no commit, no PR)
inputs:
  - request
steps:
  - id: investigate
    kind: pipeline
    pipeline: investigate
  - id: plan
    kind: pipeline
    pipeline: spec-creation
    with:
      findings: investigate.findings
    dependsOn: [investigate]
  - id: build
    kind: pipeline
    pipeline: build
    with:
      plan: plan.correct.revise
    dependsOn: [plan]
