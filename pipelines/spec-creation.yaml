id: spec-creation
version: 1
description: Harden a feature request into an adversarially reviewed spec
inputs:
  - request
  - findings
optionalInputs:
  - findings
steps:
  - id: intake
    kind: llm
    role: worker
    prompt: prompts/intake.md
  - id: enrich
    kind: llm
    role: worker
    prompt: prompts/enrich.md
    dependsOn: [intake]
  - id: critic
    kind: llm
    role: worker # reviewer-class step; same tier as the audit correctness/security reviewers
    prompt: prompts/critic.md
    schema: weaknesses
    dependsOn: [enrich]
  - id: security
    kind: llm
    role: worker # reviewer-class step; same tier as the audit correctness/security reviewers
    prompt: prompts/security.md
    schema: securityFindings
    dependsOn: [enrich]
  - id: assemble
    kind: assemble-spec
    dependsOn: [critic, security]
  - id: verify
    kind: pipeline
    pipeline: audit
    with:
      plan: assemble
    dependsOn: [assemble]
  - id: correct
    kind: pipeline
    pipeline: correct-plan
    with:
      plan: assemble
      findings: verify.synthesis
    dependsOn: [verify]
  - id: approve
    kind: gate
    message: Approve this hardened, verified spec?
    dependsOn: [correct]
  - id: persist
    kind: persist-ticket
    dependsOn: [approve]
  - id: export
    kind: export-spec
    path: specs/spec-creation
    dependsOn: [persist]
