id: spec-creation
version: 1
description: Harden a feature request into an adversarially reviewed spec
inputs:
  - request
steps:
  - id: intake
    kind: llm
    role: worker
    prompt: prompts/intake.md
  - id: enrich
    kind: llm
    role: worker
    prompt: prompts/enrich.md
    dependsOn: [intake]
  - id: critic
    kind: llm
    role: reasoner
    prompt: prompts/critic.md
    schema: weaknesses
    dependsOn: [enrich]
  - id: security
    kind: llm
    role: reasoner
    prompt: prompts/security.md
    schema: securityFindings
    dependsOn: [enrich]
  - id: assemble
    kind: assemble-spec
    dependsOn: [critic, security]
  - id: approve
    kind: gate
    message: Approve this hardened spec?
    dependsOn: [assemble]
  - id: persist
    kind: persist-ticket
    dependsOn: [approve]
  - id: export
    kind: export-spec
    path: specs/spec-creation
    dependsOn: [persist]
