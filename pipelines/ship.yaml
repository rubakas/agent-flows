id: ship
version: 1
description: Gate and commit locally after human approval
inputs:
  - plan
steps:
  # Gate exists because the commit is irreversible from the pipeline's point of
  # view — a mistake here cannot be undone without manual git history editing.
  - id: approve
    kind: gate
    message: Commit all staged changes locally?
    manualOnly: true
  # Runs real git commands. The gate above must pass before these steps execute.
  # `git add -u` stages only files git already tracks: `-A` would sweep in local,
  # untracked files such as .claude/launch.json that were never meant to be committed.
  # The message is a fixed string on purpose. Check commands are NOT placeholder-
  # rendered, and they must not be: interpolating model output into a shell string
  # is command injection. A descriptive message is the operator's job on amend.
  #
  # This is the last step on purpose. A `pr` step ran `gh pr create --fill` here
  # until 2026-09-21; it was removed by owner directive (ADR-0019 amendment): no
  # workflow may push or open a pull request while the tool is not yet trusted for
  # unattended operation. The commit is local and stays local; publishing it is the
  # operator's own `git push`, outside any pipeline.
  - id: commit
    kind: check
    command: 'git add -u && git commit -m "feat: apply approved plan"'
    dependsOn: [approve]
