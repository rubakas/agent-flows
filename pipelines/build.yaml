id: build
version: 1
description: Execute the approved plan then loop test-and-fix until the suite passes
# stage-handoff (spec 029 FR-011): inputs.plan ← artifact.spec from spec-creation or
# correct-plan. When starting via artifactPath the daemon maps artifact.spec → plan.
# artifact.spec may be a HardenedSpec object (written by spec-creation's assemble-spec step)
# or a plain string (written by correct-plan). A HardenedSpec is rendered with
# renderSpecKitSpec so plan arrives as the same markdown the operator read at the gate.
inputs:
  - plan
steps:
  - id: develop
    kind: pipeline
    pipeline: develop
  - id: converge
    kind: loop
    pipeline: build-round
    maxIterations: 3
    # until: test.passed — test is the check step in build-round; resolveDotPath
    # reads inputData["test"]["passed"] from the body workflow's accumulated context.
    # buildCheckStep stores the CheckResult under [step.id], so ctx["test"].passed
    # is the authoritative pass signal (exit code 0 = passed: true).
    until: test.passed
    dependsOn: [develop]
  # Adversarial review runs once, after the loop converges — not inside it.
  # `test` is a cheap deterministic check and is the loop's termination signal;
  # `audit` is three model calls, and inside the loop it would cost up to nine per
  # build while reviewing intermediate, still-broken states. ADR-0015 asks for
  # verification on the code in a fresh context; this is where that belongs.
  - id: review
    kind: pipeline
    pipeline: audit
    with:
      plan: plan
    dependsOn: [converge]
